name: Create page from issue

permissions:
  contents: write
  pull-requests: write

on:
  issues:
    types: [opened, edited]

jobs:
  generate-page:
    name: Generate page file and open PR
    runs-on: ubuntu-latest
    if: contains(join(github.event.issue.labels.*.name), 'new-page')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse issue fields
        id: parse
        run: |
          BODY="${{ github.event.issue.body }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # get page title from the issue title if starts with "New page request:" or fallback to issue title / first non-empty line in body
          PAGE_TITLE=$(echo "$ISSUE_TITLE" | sed -E 's/^[Nn]ew page request:\s*//')
          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE="$ISSUE_TITLE"
          fi
          PAGE_TITLE=$(echo "$PAGE_TITLE" | sed -E 's/^\s*//;s/\s*$//')

          # support optional explicit page-title in issue body
          BODY_PAGE_TITLE=$(printf "%s\n" "$BODY" | grep -m1 -Eo '^page-title:[[:space:]]*.*' | sed 's/^page-title:[[:space:]]*//')
          if [ -n "$BODY_PAGE_TITLE" ]; then
            PAGE_TITLE="$BODY_PAGE_TITLE"
          fi

          if [ -z "$PAGE_TITLE" ]; then
            PAGE_TITLE=$(printf "%s\n" "$BODY" | sed -n '/./{s/^\s*//;s/\s*$//;p;q}')
          fi

          # parse markdown content between content markers
          CONTENT=$(printf "%s\n" "$BODY" | awk '/^<!-- content -->/{flag=1; next}/^<!-- \/content -->/{flag=0} flag')

          # fallback: if no markers, use whole body minus explicit metadata lines
          if [ -z "$CONTENT" ]; then
            CONTENT=$(printf "%s\n" "$BODY" | sed -E '/^page-path:/Id;/^page-title:/Id')
            CONTENT=$(echo "$CONTENT" | sed -E 's/^\s+//;s/\s+$//')
          fi

          echo "page_title='$PAGE_TITLE'"
          echo "content length=${#CONTENT}"

          if [ -z "$PAGE_TITLE" ] || [ -z "$CONTENT" ]; then
            echo "Missing page title or content in issue. Make sure title/markers exist. Got title='$PAGE_TITLE' content-length='${#CONTENT}'" >&2
            exit 1
          fi

          SLUG=$(echo "$PAGE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          if [ -z "$SLUG" ]; then
            echo "Could not create a slug from page title." >&2
            exit 1
          fi

          PAGE_PATH=$(printf "%s\n" "$BODY" | grep -m1 -Eo '^page-path:[[:space:]]*.*' | sed 's/^page-path:[[:space:]]*//')
          if [ -z "$PAGE_PATH" ]; then
            PAGE_PATH="content/learning/$SLUG.mdx"
          fi

          {
            echo "page_path=$PAGE_PATH"
            echo "page_title=$PAGE_TITLE"
            echo "content<<__CONTENT__"
            printf "%s\n" "$CONTENT"
            echo "__CONTENT__"
          } >> "$GITHUB_OUTPUT"

      - name: Create content directory
        run: |
          TARGET=$(dirname "${{ steps.parse.outputs.page_path }}")
          mkdir -p "$TARGET"

      - name: Create page file from issue
        id: create
        env:
          TARGET: ${{ steps.parse.outputs.page_path }}
          PAGE_TITLE: ${{ steps.parse.outputs.page_title }}
          CONTENT: ${{ steps.parse.outputs.content }}
        run: |
          if [ -f "$TARGET" ]; then
            echo "Page already exists: $TARGET" && exit 0
          fi

          python <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          target = Path(os.environ["TARGET"])
          title = os.environ["PAGE_TITLE"].strip()
          content = os.environ["CONTENT"].strip()

          if "export const meta" in content:
              output = f"{content}\n"
          elif str(target).startswith("content/logs/"):
              date_match = re.search(r"(\d{4}-\d{2}-\d{2})", str(target))
              log_date = date_match.group(1) if date_match else target.stem
              output = (
                  "export const meta = {\n"
                  f"  title: {json.dumps(title)},\n"
                  f"  description: {json.dumps(f'Daily log for {log_date}.')},\n"
                  f"  date: {json.dumps(log_date)},\n"
                  "}\n\n"
                  f"{content}\n"
              )
          else:
              output = (
                  "export const meta = {\n"
                  f"  title: {json.dumps(title)},\n"
                  "}\n\n"
                  f"{content}\n"
              )

          target.write_text(output, encoding="utf-8")
          PY
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request (new branch)
        if: steps.create.outputs.created == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add page from issue #${{ github.event.issue.number }}"
          title: "Add page from issue #${{ github.event.issue.number }}"
          body: |
            This PR adds a new content page as requested by issue #${{ github.event.issue.number }}.
            
            - path: `${{ steps.parse.outputs.page_path }}`
            - title: `${{ steps.parse.outputs.page_title }}`

          branch: "issue-${{ github.event.issue.number }}-new-page"
          base: main
          labels: from-issue
